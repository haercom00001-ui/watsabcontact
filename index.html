<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            align-items: center;

        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);

        h1 {

            margin-bottom: 20px;
        }
        p {

        }

            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .whatsapp-button:hover {

        }

    <div class="container">

</html>
